<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ doc.title }} — Search Results</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    {% include '_sidebar.html' %}

    <div class="doc-results-container">
        <a href="{{ url_for('index', q=query) }}" class="back-link" style="display:inline-flex;margin-bottom:1.5rem;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2" style="margin-right:.4rem">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            Back to Search
        </a>

        <div class="results-header">
            <h1>{{ doc.title }}</h1>
            <p>Found <strong>{{ total_matches }}</strong> page{% if total_matches != 1 %}s{% endif %} matching
               "<strong>{{ query }}</strong>"</p>
        </div>

        <div class="page-list">
            {% for page in matches %}
            <a href="{{ url_for('view_document', doc_id=doc.id, page=page.page_num, q=query) }}"
               class="page-card animate-fade-in">
                <span class="page-number">Page {{ page.page_num }}</span>
                <div class="match-snippet">…{{ page.snippet|safe }}…</div>
            </a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
