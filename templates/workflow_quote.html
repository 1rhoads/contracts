<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Prices — Contracts Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    {% include '_sidebar.html' %}

    <div class="workflow-container">

        <div class="page-header">
            <h1 class="page-title">Compare <span class="highlight">Prices</span></h1>
            <p class="page-subtitle">Find the best contract price for a product across all vendors.</p>
        </div>

        <!-- Step 1: OEM -->
        <div class="workflow-step" id="step-oem">
            <label for="oem-select">Step 1 — Select Manufacturer (OEM)</label>
            <select id="oem-select">
                <option value="">— Select OEM —</option>
            </select>
        </div>

        <!-- Step 2: Product -->
        <div class="workflow-step" id="step-product" style="display:none;">
            <label for="product-select">Step 2 — Select Product / SKU</label>
            <select id="product-select">
                <option value="">— Select Product —</option>
            </select>
        </div>

        <!-- Step 3: Vendors -->
        <div class="workflow-step" id="step-vendor" style="display:none;">
            <label>Step 3 — Available Vendors &amp; Prices</label>
            <div id="vendor-results"></div>
        </div>

    </div>

    <script>
        const oemSelect     = document.getElementById('oem-select');
        const productSelect = document.getElementById('product-select');
        const stepProduct   = document.getElementById('step-product');
        const stepVendor    = document.getElementById('step-vendor');
        const vendorResults = document.getElementById('vendor-results');

        fetch('/api/oems')
            .then(r => r.json())
            .then(oems => {
                oems.forEach(oem => {
                    const opt = document.createElement('option');
                    opt.value = oem;
                    opt.textContent = oem;
                    oemSelect.appendChild(opt);
                });
            });

        oemSelect.addEventListener('change', () => {
            const oem = oemSelect.value;
            stepProduct.style.display = 'none';
            stepVendor.style.display  = 'none';
            productSelect.innerHTML   = '<option value="">— Select Product —</option>';
            if (!oem) return;

            fetch(`/api/oems/${encodeURIComponent(oem)}/products`)
                .then(r => r.json())
                .then(products => {
                    products.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.sku;
                        opt.textContent = p.sku + (p.description ? ' — ' + p.description : '');
                        productSelect.appendChild(opt);
                    });
                    stepProduct.style.display = 'block';
                });
        });

        productSelect.addEventListener('change', () => {
            const sku = productSelect.value;
            if (!sku) { stepVendor.style.display = 'none'; return; }

            stepVendor.style.display = 'block';
            vendorResults.innerHTML  = '<div class="loading-text">Loading vendors…</div>';

            fetch(`/api/products/vendors?sku=${encodeURIComponent(sku)}`)
                .then(r => r.json())
                .then(items => {
                    if (items.length === 0) {
                        vendorResults.innerHTML = '<p style="color:var(--text-secondary)">No vendors found for this item.</p>';
                        return;
                    }

                    let html = `
                        <table class="workflow-table">
                            <thead>
                                <tr>
                                    <th>Vendor</th>
                                    <th>Price</th>
                                    <th>Unit</th>
                                    <th>Description</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    items.forEach(item => {
                        html += `
                            <tr>
                                <td>${item.vendor}</td>
                                <td><strong>${item.price}</strong></td>
                                <td style="color:var(--text-muted)">${item.unit || '—'}</td>
                                <td>${item.description || '—'}</td>
                                <td><a href="/document/${item.doc_id}" class="button small">View</a></td>
                            </tr>
                        `;
                    });

                    html += '</tbody></table>';
                    vendorResults.innerHTML = html;
                });
        });
    </script>
</body>
</html>
